name: Feature CI

on:
  push:
    branches:
      - feature/text-to-image
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: Final render soundtrack regression
        run: node tests/final-render-policy.test.mjs

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

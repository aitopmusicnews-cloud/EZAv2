services:
  - type: web
    name: EZAv2
    runtime: node
    buildCommand: python3 -m pip install -r audio_analysis/requirements.txt && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm --filter @mvs/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: AGNES_API_KEY
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://ezav2.onrender.com
      - key: WEB_ORIGIN
        value: https://ezav2.onrender.com
      - key: WEB_DIST_DIR
        value: apps/web/dist
      - key: STORAGE_BACKEND
        value: s3
      - key: STORAGE_DIR
        value: ./storage
      - key: S3_BUCKET
        value: rendernodock-storage-052080186671-us-east-1-an
      - key: S3_REGION
        value: us-east-1
      - key: S3_PUBLIC_URL_BASE
        value: https://rendernodock-storage-052080186671-us-east-1-an.s3.us-east-1.amazonaws.com
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
